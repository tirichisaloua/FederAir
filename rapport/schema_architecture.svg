<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Architecture - mini-espace de données fédéré (Santé et qualité de l'air)</text>

  <!-- Org A -->
  <rect x="40" y="70" width="260" height="190" rx="10" fill="#e8f4fd" stroke="#2b6cb0" stroke-width="2"/>
  <text x="170" y="95" text-anchor="middle" font-weight="bold">Organisation A - Environnement</text>
  <text x="170" y="115" text-anchor="middle">Nœud A - API FastAPI :8001</text>
  <text x="60" y="140">• GET  /catalog (catalogue DCAT-like)</text>
  <text x="60" y="160">• POST /contracts/negotiate (finalité)</text>
  <text x="60" y="180">• GET  /classifications (signées HMAC)</text>
  <rect x="80" y="205" width="180" height="40" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="170" y="230" text-anchor="middle">SQLite environnement.db (PM2.5)</text>

  <!-- Org B -->
  <rect x="600" y="70" width="260" height="190" rx="10" fill="#fdf0e8" stroke="#c05621" stroke-width="2"/>
  <text x="730" y="95" text-anchor="middle" font-weight="bold">Organisation B - Hôpital</text>
  <text x="730" y="115" text-anchor="middle">Nœud B - API FastAPI :8002</text>
  <text x="620" y="140">• POST /compute</text>
  <text x="620" y="160">• vérifie clé API + signature HMAC</text>
  <text x="620" y="180">• seuil minimal (3 jours) + bruit Laplace</text>
  <rect x="640" y="205" width="180" height="40" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="730" y="230" text-anchor="middle">SQLite hopital.db (admissions)</text>

  <!-- Org C -->
  <rect x="290" y="340" width="320" height="130" rx="10" fill="#edf7ed" stroke="#2f855a" stroke-width="2"/>
  <text x="450" y="365" text-anchor="middle" font-weight="bold">Organisation C - Laboratoire (orchestrateur)</text>
  <text x="450" y="390" text-anchor="middle">client_laboratoire.py</text>
  <text x="450" y="412" text-anchor="middle">Ne lit jamais les fichiers SQLite</text>
  <text x="450" y="434" text-anchor="middle">Ne reçoit que : catalogue, classifications, agrégats</text>

  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>

  <!-- flows -->
  <line x1="330" y1="340" x2="200" y2="262" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="140" y="305" font-size="12">1-4  catalogue, contrat,</text>
  <text x="140" y="321" font-size="12">classifications signées</text>
  <line x1="570" y1="340" x2="700" y2="262" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="640" y="305" font-size="12">5  paquet signé</text>
  <text x="640" y="321" font-size="12">→ agrégats uniquement</text>
  <line x1="300" y1="165" x2="600" y2="165" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="450" y="155" text-anchor="middle" font-size="12" fill="#555">secret HMAC partagé A ↔ B</text>
  <text x="450" y="175" text-anchor="middle" font-size="12" fill="#555">(le labo ne le connaît pas)</text>

  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">Les données brutes restent chez leur propriétaire ; seuls classifications et agrégats circulent.</text>
</svg>
